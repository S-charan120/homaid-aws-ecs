server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # Docker Compose provides the "api" service DNS name on its project network.
  location /api/ {
    proxy_pass http://api:8081/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Web liveness is intentionally independent of API readiness.
  location = /health {
    default_type text/plain;
    return 200 "ok";
  }

  # In local Compose only, expose API readiness through the web origin.
  location = /ready {
    proxy_pass http://api:8081/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

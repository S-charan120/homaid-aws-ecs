services:
  web:
    build:
      context: ./web
      args:
        NGINX_CONFIG: nginx-compose.conf
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    build: ./api
    environment:
      NODE_ENV: development
      PORT: 8081
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/homaid}
      MONGODB_DB: ${MONGODB_DB:-homaid}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongo_data:

name: Homaid CI and ECS delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homaid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund
      - name: API tests and syntax
        working-directory: api
        run: npm test && npm run check
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build React application
        working-directory: web
        run: npm run build
      - name: Validate Compose model
        env:
          ADMIN_API_TOKEN: local-ci-only-token
        run: docker compose config -q
      - name: Build API image
        run: docker build -t homaid-api:test ./api
      - name: Build web image
        run: docker build -t homaid-web:test ./web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_TO_ASSUME != ''
    needs: validate
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: homaid-github-actions
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push commit-SHA images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$API_REPOSITORY:$IMAGE_TAG" ./api
          docker build -t "$REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG" ./web
          docker push "$REGISTRY/$API_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG"
      - name: Register immutable task definitions and roll out ECS
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$CLUSTER" && test -n "$API_SERVICE" && test -n "$WEB_SERVICE"
          API_CURRENT=$(aws ecs describe-services --cluster "$CLUSTER" --services "$API_SERVICE" --query 'services[0].taskDefinition' --output text)
          WEB_CURRENT=$(aws ecs describe-services --cluster "$CLUSTER" --services "$WEB_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$API_CURRENT" --query taskDefinition > api-current.json
          aws ecs describe-task-definition --task-definition "$WEB_CURRENT" --query taskDefinition > web-current.json
          jq --arg image "$REGISTRY/$API_REPOSITORY:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "api" then .image = $image else . end) | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' api-current.json > api-next.json
          jq --arg image "$REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "web" then .image = $image else . end) | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' web-current.json > web-next.json
          API_TASK=$(aws ecs register-task-definition --cli-input-json file://api-next.json --query taskDefinition.taskDefinitionArn --output text)
          WEB_TASK=$(aws ecs register-task-definition --cli-input-json file://web-next.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --task-definition "$API_TASK"
          aws ecs update-service --cluster "$CLUSTER" --service "$WEB_SERVICE" --task-definition "$WEB_TASK"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API_SERVICE" "$WEB_SERVICE"

name: Homaid CI and ECS delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homaid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate local Markdown links
        run: python3 scripts/check-markdown-links.py
      - name: Install API dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: API tests and syntax
        working-directory: api
        run: npm test && npm run check
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build React application
        working-directory: web
        run: npm run build
      - name: Validate deployment contracts
        run: python3 scripts/check-deployment-contract.py
      - name: Validate Compose model
        env:
          ADMIN_API_TOKEN: local-ci-only-token
        run: docker compose config -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Validate Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff -recursive
          terraform init -backend=false
          terraform validate
      - name: Build API image
        run: docker build -t homaid-api:test ./api
      - name: Build web image
        run: docker build -t homaid-web:test ./web
      - name: Exercise booking lifecycle with MongoDB
        env:
          ADMIN_API_TOKEN: local-ci-only-token
        run: |
          set -euo pipefail
          docker compose up -d --build
          curl -fsS http://localhost:8080/health | grep -qi ok
          curl -fsS http://localhost:8080/ready | jq -e '.status == "ready"' >/dev/null
          cleanup() { docker compose down -v --remove-orphans; }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/services >/tmp/homaid-services.json; then break; fi
            sleep 2
          done
          jq -e '.items | length >= 1' /tmp/homaid-services.json >/dev/null
          SCHEDULED_AT="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          PAYLOAD="$(jq -n --arg scheduledAt "$SCHEDULED_AT" '{serviceId:"cleaning",customerName:"CI Test Customer",customerEmail:"ci-test@example.com",address:"123 Integration Test Street",scheduledAt:$scheduledAt,notes:"Automated CI booking lifecycle"}')"
          BOOKING="$(curl -fsS -X POST http://localhost:8080/api/bookings -H 'Content-Type: application/json' -H 'Idempotency-Key: gha-${{ github.run_id }}-${{ github.run_attempt }}' -d "$PAYLOAD")"
          BOOKING_ID="$(printf '%s' "$BOOKING" | jq -r .bookingId)"
          ACCESS_TOKEN="$(printf '%s' "$BOOKING" | jq -r .accessToken)"
          test -n "$BOOKING_ID" && test -n "$ACCESS_TOKEN"
          for status in confirmed in_progress completed; do
            curl -fsS -X PATCH "http://localhost:8080/api/bookings/$BOOKING_ID/status" \
              -H 'Content-Type: application/json' \
              -H 'X-Admin-Token: local-ci-only-token' \
              -d "$(jq -n --arg status "$status" '{status:$status}')" >/tmp/homaid-status.json
            jq -e --arg status "$status" '.status == $status' /tmp/homaid-status.json >/dev/null
          done
          curl -fsS "http://localhost:8080/api/bookings/$BOOKING_ID" -H "X-Booking-Token: $ACCESS_TOKEN" | jq -e '.status == "completed"' >/dev/null
          echo "Booking creation, admin state transitions and customer-token retrieval passed."
      - name: Upload committed dependency lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homaid-npm-lockfiles
          path: |
            api/package-lock.json
            web/package-lock.json
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_ROLE_TO_ASSUME != ''
    needs: validate
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: homaid-github-actions
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push commit-SHA images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            docker build -t "$REGISTRY/$API_REPOSITORY:$IMAGE_TAG" ./api
            docker push "$REGISTRY/$API_REPOSITORY:$IMAGE_TAG"
          else
            echo "API image tag already exists; reusing immutable image $IMAGE_TAG"
          fi
          if ! aws ecr describe-images --repository-name "$WEB_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            docker build -t "$REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG" ./web
            docker push "$REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG"
          else
            echo "Web image tag already exists; reusing immutable image $IMAGE_TAG"
          fi
      - name: Register immutable task definitions and roll out ECS
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$CLUSTER" && test -n "$API_SERVICE" && test -n "$WEB_SERVICE"
          API_CURRENT=$(aws ecs describe-services --cluster "$CLUSTER" --services "$API_SERVICE" --query 'services[0].taskDefinition' --output text)
          WEB_CURRENT=$(aws ecs describe-services --cluster "$CLUSTER" --services "$WEB_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$API_CURRENT" --query taskDefinition > api-current.json
          aws ecs describe-task-definition --task-definition "$WEB_CURRENT" --query taskDefinition > web-current.json
          jq --arg image "$REGISTRY/$API_REPOSITORY:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "api" then .image = $image else . end) | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' api-current.json > api-next.json
          jq --arg image "$REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "web" then .image = $image else . end) | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' web-current.json > web-next.json
          API_TASK=$(aws ecs register-task-definition --cli-input-json file://api-next.json --query taskDefinition.taskDefinitionArn --output text)
          WEB_TASK=$(aws ecs register-task-definition --cli-input-json file://web-next.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --task-definition "$API_TASK"
          aws ecs update-service --cluster "$CLUSTER" --service "$WEB_SERVICE" --task-definition "$WEB_TASK"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API_SERVICE" "$WEB_SERVICE"
